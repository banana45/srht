<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文档批量生成工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>合同批量生成工具</h1>
          <p>填写数据，批量生成合同或店铺经营证明 Word 文件。</p>
        </div>
        <div class="actions">
          <label class="file-button">
            导入 Excel/CSV
            <input id="fileInput" type="file" accept=".xlsx,.csv">
          </label>
          <button id="addRowBtn" type="button">添加行</button>
          <button id="generateBtn" type="button" class="primary">生成文件</button>
        </div>
      </header>

      <nav class="tabs" aria-label="功能页签">
        <button class="tab active" type="button" data-mode="contract">产品服务合同</button>
        <button class="tab" type="button" data-mode="storeProof">店铺经营证明</button>
      </nav>

      <section id="notice" class="notice"></section>

      <section class="table-wrap" aria-label="批量数据">
        <table>
          <thead>
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="rowsBody"></tbody>
        </table>
      </section>

      <section id="progressPanel" class="progress-panel" hidden>
        <div class="progress-row">
          <div>
            <strong>总进度</strong>
            <span id="totalProgressText">0%</span>
          </div>
          <progress id="totalProgress" value="0" max="100"></progress>
        </div>
        <div class="progress-row">
          <div>
            <strong id="currentProgressLabel">当前文件</strong>
            <span id="currentProgressText">0%</span>
          </div>
          <progress id="currentProgress" value="0" max="100"></progress>
        </div>
        <div id="progressDetail" class="progress-detail"></div>
      </section>

      <div id="message" class="message" role="status"></div>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
